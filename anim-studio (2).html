/* ───────── ค่าคงที่ & ยูทิลิตี้ ───────── */

const ANIM = ['x', 'y', 'scale', 'rotation', 'opacity', 'mouth']
const bounceOut = t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375 }

}

const POSES = { rest: Object.fromEntries(BONES.map(b => [b, 0])), handsUp: { ArmL: 140, ArmR: -140 }, raiseR: { ArmR: -140 }, raiseL: { ArmL: 140 }, nodDown: { Head: 18 }, lean: { Hips: 8, Head: -8 } }

const VAJAX_URL = 'https://api.aiforthai.in.th/vajax', OPENAI_URL = 'https://api.openai.com/v1/audio/speech', OPENROUTER_URL = 'https://openrouter.ai/api/v1/audio/speech', HEYGEN_URL = 'https://api.heygen.com/v3/voices/speech'
const EDGE_CDN = 'https://cdn.jsdelivr.net/npm/edge-tts-universal@1.3.3/dist/browser.js'
const TTS_PRESET = { openai: { url: OPENAI_URL, model: 'tts-1', voice: 'alloy' }, openrouter: { url: OPENROUTER_URL, model: '', voice: '' }, eleven: { model: 'eleven_multilingual_v2', voice: '' }, vajax: { url: VAJAX_URL, model: '', voice: '' }, heygen: { url: HEYGEN_URL, model: '', voice: '' }, edge: { url: '/api/edge', model: '', voice: 'th-TH-PremwadeeNeural' } }
// แปลงเสียงใดๆ → WAV 16-bit mono 24kHz (VAJAX ต้องการเสียงอ้างอิงเป็น WAV)
async function toWav(ab) {

  s.buffer = ab; s.connect(oc.destination); s.start()

  out.setUint32(24, sr, true); out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, d.length * 2, true)

// ห่อเสียง PCM ดิบ (16-bit little-endian) ให้เป็นไฟล์ WAV เพื่อให้ decodeAudioData / บันทึกโปรเจกต์ใช้ต่อได้

  o.setUint32(24, rate, true); o.setUint32(28, rate * ch * 2, true); o.setUint16(32, ch * 2, true); o.setUint16(34, 16, true); w(36, 'data'); o.setUint32(40, n, true)

}
const imgUrl = im => { if (!im.__u) { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); im.__u = c.toDataURL('image/png') } return im.__u }
const PRESETS = [['TikTok / Reels / Shorts 9:16', 1080, 1920], ['YouTube 16:9', 1920, 1080], ['Instagram 4:5', 1080, 1350], ['Square 1:1', 1080, 1080]]
const MEDIA = [['Kenney — สไปรต์/ตัวละคร CC0', 'https://kenney.nl/assets'], ['OpenGameArt', 'https://opengameart.org'], ['Openclipart — Public Domain', 'https://openclipart.org'],
  ['itch.io — Free Game Assets', 'https://itch.io/game-assets/free'], ['Pixabay — ภาพ/เพลง/เสียง', 'https://pixabay.com'], ['Freesound — เอฟเฟกต์เสียง', 'https://freesound.org']]
function EaseGraph({ k }) {
  const f = EASE[k], pts = Array.from({ length: 41 }, (_, i) => `${((i / 40) * 60).toFixed(1)},${(40 - f(i / 40) * 30).toFixed(1)}`).join(' ')
  return <svg width="64" height="44" viewBox="0 -4 64 48" className="bg-zinc-800 rounded shrink-0"><polyline points={pts} fill="none" stroke="#fbbf24" strokeWidth="2" /></svg>
}
const B = 'px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs disabled:opacity-40'
const IN = 'bg-zinc-800 rounded px-2 py-1 w-full outline-none focus:ring-1 ring-sky-500'
let uid = 1

/* ───────── Sound Effect สังเคราะห์ด้วย Web Audio API (ไม่ต้องใช้ไฟล์เสียง) ───────── */
const SFX_LIST = [['pop', 'ป๊อป'], ['click', 'คลิก'], ['ding', 'ติ๊ง'], ['coin', 'เหรียญ'], ['whoosh', 'วูช (เข้า)'], ['swoosh', 'สวิช (ออก)'], ['boom', 'ตูม'], ['hit', 'ตุบ / ชน'], ['zap', 'แฟลช / ซัพ'], ['sparkle', 'ประกาย'], ['error', 'ผิดพลาด'], ['type', 'พิมพ์ดีด'], ['jump', 'กระโดด'], ['laser', 'เลเซอร์']]
const _noise = new WeakMap()
const noiseBuf = a => {
  if (!_noise.has(a)) { const b = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; _noise.set(a, b) }
  return _noise.get(a)
}
// เล่นเอฟเฟกต์ name ที่เวลา t (เวลาของ AudioContext) ผ่านโหนด out · คืนรายการโหนดต้นเสียง (ไว้สั่ง stop)
function playSfx(a, out, name, t, vol = 1) {
  const nodes = [], pk = p => Math.max(0.0001, p * vol)
  const osc = (type, f0, f1, t0, dur, peak) => {
    const o = a.createOscillator(), g = a.createGain()
    o.type = type; o.frequency.setValueAtTime(f0, t0)
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur)
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(pk(peak), t0 + Math.min(0.012, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.05); nodes.push(o)
  }
  const noise = (type, f0, f1, t0, dur, peak, q = 1) => {
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain()
    s.buffer = noiseBuf(a); s.loop = true; fl.type = type; fl.Q.value = q
    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur)
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(pk(peak), t0 + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t0); s.stop(t0 + dur + 0.05); nodes.push(s)
  }
  switch (name) {
    case 'pop': osc('sine', 650, 140, t, 0.12, 0.9); break
    case 'click': osc('square', 1800, 900, t, 0.035, 0.35); noise('highpass', 3000, 6000, t, 0.03, 0.3); break
    case 'ding': osc('sine', 1320, 1320, t, 0.9, 0.5); osc('sine', 1980, 1980, t, 0.6, 0.22); osc('sine', 2640, 2640, t, 0.3, 0.1); break
    case 'coin': osc('square', 988, 988, t, 0.08, 0.22); osc('square', 1319, 1319, t + 0.08, 0.45, 0.22); break
    case 'whoosh': noise('bandpass', 250, 3000, t, 0.55, 0.9, 0.9); break
    case 'swoosh': noise('bandpass', 3000, 250, t, 0.4, 0.9, 0.9); break
    case 'boom': osc('sine', 130, 32, t, 0.9, 1); noise('lowpass', 500, 40, t, 0.7, 0.9); break
    case 'hit': osc('triangle', 240, 55, t, 0.2, 0.9); noise('lowpass', 3500, 200, t, 0.13, 0.6); break
    case 'zap': osc('sawtooth', 1600, 90, t, 0.28, 0.3); noise('highpass', 3500, 9000, t, 0.22, 0.35); break
    case 'sparkle': for (let i = 0; i < 6; i++) osc('sine', 1500 + i * 310, 1500 + i * 310, t + i * 0.055, 0.28, 0.18); break
    case 'error': osc('square', 220, 200, t, 0.16, 0.28); osc('square', 160, 140, t + 0.2, 0.26, 0.28); break
    case 'type': osc('square', 1300 + Math.random() * 400, 700, t, 0.03, 0.22); break
    case 'jump': osc('square', 240, 720, t, 0.2, 0.28); break
    case 'laser': osc('sawtooth', 1900, 180, t, 0.28, 0.28); break
  }
  return nodes
}
// เสียงพูดของ Google ในเบราว์เซอร์ (Web Speech API) — เลือกเสียง Google ภาษาไทยก่อน ถ้าไม่มีใช้เสียงไทยอื่น
const googleTh = vs => vs.find(v => /google/i.test(v.name) && /^th/i.test(v.lang)) || vs.find(v => /^th/i.test(v.lang))

const mk = (type, name, props = {}) => ({
  id: 'L' + uid++, type, name, parent: null, visible: true, locked: false, keys: {},
  props: { x: W / 2, y: H / 2, scale: 1, rotation: 0, opacity: 1, mouth: 0, text: 'ข้อความ', color: '#ffffff', size: 90, ...props },
})

// ค่า ณ เวลา t (Interpolation ระหว่าง Keyframe แบบ Linear / Ease)
function val(l, p, t) {
  const k = l.keys[p]
  if (!k || !k.length) return l.props[p]
  if (t <= k[0].t) return k[0].v
  const last = k[k.length - 1]
  if (t >= last.t) return last.v
  for (let i = 0; i < k.length - 1; i++) {
    const a = k[i], b = k[i + 1]
    if (t >= a.t && t <= b.t) return a.v + (b.v - a.v) * (EASE[a.ease] || EASE.linear)((t - a.t) / (b.t - a.t))
  }
  return last.v
}

function putKey(arr = [], t, v, ease, s) {
  const old = arr.find(k => Math.abs(k.t - t) < 1e-3)
  const a = arr.filter(k => Math.abs(k.t - t) >= 1e-3)
  a.push({ t, v, ease: ease ?? old?.ease ?? 'linear', s })
  return a.sort((x, y) => x.t - y.t)
}

// ถ้ามี Keyframe อยู่แล้ว → แก้แล้วบันทึก Key ที่เวลา t (auto-key) ไม่งั้นแก้ค่าพื้นฐาน
const setProp = (l, p, v, t, ease) =>
  l.keys[p]?.length ? { ...l, keys: { ...l.keys, [p]: putKey(l.keys[p], t, v, ease) } } : { ...l, props: { ...l.props, [p]: v } }

function flatten(layers) {
  const out = []
  const walk = (pid, d) => layers.filter(l => l.parent === pid).forEach(l => { out.push({ l, d }); walk(l.id, d + 1) })
  walk(null, 0)
  return out
}

// เมทริกซ์โลกของแต่ละเลเยอร์ (รองรับ Parent-Child)
function camMatrix(layers, t) {
  const c = layers.find(l => l.type === 'camera')
  if (!c) return new DOMMatrix()
  return new DOMMatrix().translate(W / 2, H / 2).rotate(-val(c, 'rotation', t)).scale(Math.max(0.05, val(c, 'scale', t))).translate(-val(c, 'x', t), -val(c, 'y', t))
}
function computeWorld(layers, t) {
  const map = new Map(), byId = new Map(layers.map(l => [l.id, l])), cam = camMatrix(layers, t)
  const get = l => {
    if (map.has(l.id)) return map.get(l.id)
    const par = l.parent && byId.get(l.parent)
    const pw = par ? get(par) : { m: cam, a: 1 }
    const m = pw.m.multiply(new DOMMatrix().translate(val(l, 'x', t), val(l, 'y', t)).rotate(val(l, 'rotation', t)).scale(val(l, 'scale', t)).translate(-(l.props.px || 0), -(l.props.py || 0)))
    const r = { m, a: pw.a * val(l, 'opacity', t) }
    map.set(l.id, r)
    return r
  }
  layers.forEach(get)
  return map
}

function bounds(ctx, l, imgs) {
  if (l.type === 'text') {
    ctx.font = `700 ${l.props.size}px ${FONT}`
    const ls = (l.props.text || ' ').split('\n'), w = Math.max(40, ...ls.map(x => ctx.measureText(x || ' ').width)), h = l.props.size * 1.25 * ls.length
    return { x: -w / 2, y: -h / 2, w, h }
  }
  if (l.type === 'image') {
    const i = imgs.get(l.id), ok = i && i.naturalWidth
    const k = ok ? 700 / Math.max(i.naturalWidth, i.naturalHeight) : 1
    const w = ok ? i.naturalWidth * k : 400, h = ok ? i.naturalHeight * k : 400
    return { x: -w / 2, y: -h / 2, w, h }
  }
  if (l.type === 'character') return { x: -150, y: -320, w: 300, h: 570 }
  if (l.type === 'bone') return { x: 0, y: -16, w: l.props.len, h: 32 }
  if (l.type === 'shape') return { x: -l.props.w / 2, y: -l.props.h / 2, w: l.props.w, h: l.props.h }
  return null
}

// ค่า static ที่ edit() สั่งเปลี่ยน ณ เวลาหนึ่ง (เช่น ข้อความ/สี) เก็บเป็นรายการ props.ch
function withChanges(l, t) {
  const ch = l.props.ch
  if (!ch) return l
  const p = { ...l.props }
  for (const e of ch) if (t >= e.t) Object.assign(p, e.p)
  return { ...l, props: p }
}
function drawLayer(ctx, l, w, t, imgs) {
  l = withChanges(l, t)
  if (l.type === 'bone') return
  const b = bounds(ctx, l, imgs)
  if (!b) return
  ctx.setTransform(w.m)
  ctx.globalAlpha = Math.max(0, Math.min(1, w.a))
  if (l.type === 'text') {
    ctx.font = `700 ${l.props.size}px ${FONT}`
    ctx.fillStyle = l.props.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    const ls = (l.props.text || '').split('\n'), lh = l.props.size * 1.25
    const an = l.props.anim, u = an && an !== 'none' ? Math.max(0, Math.min(1, (t - (l.props.animAt || 0)) / (l.props.animDur || 0.8))) : 1

    if (an === 'slide') ctx.translate(-(1 - EASE.out(u)) * W * 0.6, 0)

    let rem = an === 'typewriter' ? Math.ceil([...(l.props.text || '')].length * u) : Infinity
    ls.forEach((x, i) => {
      const y = (i - (ls.length - 1) / 2) * lh, ch = [...x]
      if (an === 'typewriter') { ctx.textAlign = 'left'; ctx.fillText(ch.slice(0, Math.max(0, rem)).join(''), -ctx.measureText(x).width / 2, y); rem -= ch.length + 1 }
      else ctx.fillText(x, 0, y)

  } else if (l.type === 'image') {
    const i = imgs.get(l.id)
    if (i && i.naturalWidth) ctx.drawImage(i, b.x, b.y, b.w, b.h)
    else { ctx.fillStyle = '#334155'; ctx.fillRect(b.x, b.y, b.w, b.h) }
  } else if (l.type === 'shape') {
    ctx.fillStyle = l.props.color; ctx.beginPath()

    else ctx.roundRect(b.x, b.y, b.w, b.h, Math.min(b.w, b.h) / 3)

    const line = (a, b2, c, d) => { ctx.beginPath(); ctx.moveTo(a, b2); ctx.lineTo(c, d); ctx.stroke() }

    ctx.strokeStyle = '#ffd3a8'; ctx.lineWidth = 26; line(-75, -40, -130, 70); line(75, -40, 130, 70)
    ctx.strokeStyle = '#4338ca'; ctx.lineWidth = 40; line(-35, 150, -35, 230); line(35, 150, 35, 230)
    ctx.fillStyle = '#6366f1'; ctx.beginPath(); ctx.roundRect(-85, -95, 170, 250, 40); ctx.fill()
    ctx.fillStyle = '#ffd3a8'; ctx.beginPath(); ctx.arc(0, -190, 100, 0, 7); ctx.fill()
    ctx.fillStyle = '#292524'; ctx.beginPath(); ctx.arc(0, -215, 104, Math.PI, 0); ctx.fill()
    ctx.fillStyle = '#1f2937'
    ;[-35, 35].forEach(x => { ctx.beginPath(); ctx.arc(x, -185, 10, 0, 7); ctx.fill() })
    ctx.fillStyle = '#7f1d1d'; ctx.beginPath(); ctx.ellipse(0, -145, 28, 4 + m * 26, 0, 0, 7); ctx.fill()
  }
}

function drawSub(ctx, text, st = 'box') {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1
  const fs = Math.round(Math.min(W, H) * 0.054)
  ctx.font = `700 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const lines = []; let cur = ''
  for (const ch of text) { if (ctx.measureText(cur + ch).width > W * 0.82) { lines.push(cur); cur = ch } else cur += ch }
  lines.push(cur)
  const lh = fs * 1.35, bh = lines.length * lh + fs * 0.5, y0 = H * 0.82 - bh
  if (st === 'box') { ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.beginPath(); ctx.roundRect(W * 0.06, y0, W * 0.88, bh, fs * 0.4); ctx.fill() }
  lines.forEach((x, i) => {
    const y = y0 + fs * 0.25 + lh * (i + 0.5)
    if (st === 'outline' || st === 'tiktok') { ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.28; ctx.strokeStyle = '#000'; ctx.strokeText(x, W / 2, y) }
    if (st === 'neon') { ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = fs * 0.6 }
    ctx.fillStyle = st === 'tiktok' ? '#fde047' : st === 'neon' ? '#a5f3fc' : '#fff'; ctx.fillText(x, W / 2, y); ctx.shadowBlur = 0
  })
}

function drawGizmo(ctx, w, b, vs) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1
  const pts = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map(([x, y]) => w.m.transformPoint(new DOMPoint(x, y)))
  const rp = w.m.transformPoint(new DOMPoint(b.x + b.w / 2, b.y - 70)), tp = w.m.transformPoint(new DOMPoint(b.x + b.w / 2, b.y))
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3 / vs; ctx.beginPath()
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.closePath()
  ctx.moveTo(tp.x, tp.y); ctx.lineTo(rp.x, rp.y); ctx.stroke()
  const hs = 14 / vs
  ctx.fillStyle = '#fff'
  pts.forEach(p => ctx.fillRect(p.x - hs / 2, p.y - hs / 2, hs, hs))
  ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(rp.x, rp.y, hs / 1.6, 0, 7); ctx.fill()
}

/* ───────── ระบบสคริปต์: แปลงคำสั่งเป็น Keyframe ───────── */
// กระดูกชี้ไปทางแกน +X ของตัวเอง, จุดหมุน (Pivot) = ข้อต่อที่ (0,0)
function drawBones(ctx, layers, world, sel) {
  ctx.globalAlpha = 1
  layers.forEach(l => {
    if (l.type !== 'bone' || !l.visible) return
    const len = l.props.len, w = Math.min(Math.max(len * 0.12, 8), 26), on = l.id === sel
    ctx.setTransform(world.get(l.id).m)
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.18, -w); ctx.lineTo(len, 0); ctx.lineTo(len * 0.18, w); ctx.closePath()
    ctx.fillStyle = on ? 'rgba(251,191,36,.45)' : 'rgba(56,189,248,.35)'
    ctx.strokeStyle = on ? '#fbbf24' : '#38bdf8'; ctx.lineWidth = 3
    ctx.fill(); ctx.stroke()
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill()
  })
}

function rig() {
  const bone = (name, par, x, y, rotation, len) => ({ ...mk('bone', name, { x, y, rotation, len }), parent: par ? par.id : null })
  const shape = (name, par, x, y, o) => ({ ...mk('shape', name, { x, y, ...o }), parent: par.id })
  const skin = '#ffd3a8'
  const hips = bone('Hips', null, 540, 1180, -90, 250), head = bone('Head', hips, 250, 0, 0, 150)
  const armL = bone('ArmL', hips, 225, -105, 200, 150), foreL = bone('ForearmL', armL, 150, 0, 0, 140)
  const armR = bone('ArmR', hips, 225, 105, 160, 150), foreR = bone('ForearmR', armR, 150, 0, 0, 140)
  const arm = (n, b, len) => [shape(n + '_img', b, len / 2, 0, { w: len, h: 44, color: skin, kind: 'rrect' })]
  return [
    hips, shape('Torso', hips, 125, 0, { w: 250, h: 190, color: '#6366f1', kind: 'rrect' }),
    head, shape('Face', head, 95, 0, { w: 200, h: 200, color: skin, kind: 'circle' }),
    shape('EyeL', head, 120, -40, { w: 24, h: 24, color: '#1f2937', kind: 'circle' }),
    shape('EyeR', head, 120, 40, { w: 24, h: 24, color: '#1f2937', kind: 'circle' }),
    shape('Mouth', head, 55, 0, { w: 14, h: 60, color: '#7f1d1d', kind: 'rrect' }),
    armL, ...arm('ArmL', armL, 150), foreL, ...arm('ForearmL', foreL, 140), shape('HandL', foreL, 140, 0, { w: 56, h: 56, color: skin, kind: 'circle' }),
    armR, ...arm('ArmR', armR, 150), foreR, ...arm('ForearmR', foreR, 140), shape('HandR', foreR, 140, 0, { w: 56, h: 56, color: skin, kind: 'circle' }),
  ]
}

// สร้างตัวละครสำเร็จรูป: แยกส่วน = กระดูก + รูปทรงที่ผูกไว้ / ติดกัน = กลุ่ม (Group) ของรูปทรง
function makeChar(kind, cx, cy, taken) {
  let out = []
  const B = (name, par, x, y, rotation, len) => { const n = { ...mk('bone', name, { x, y, rotation, len }), parent: par ? par.id : null }; out.push(n); return n }
  const G = (name, x, y) => { const n = mk('group', name, { x, y }); out.push(n); return n }
  const S = (name, par, x, y, w, h, color, k = 'rrect') => { out.push({ ...mk('shape', name, { x, y, w, h, color, kind: k }), parent: par.id }) }
  const limb = (up, lo, par, x, y, rot, l1, l2, th, col, end) => {
    const a = B(up, par, x, y, rot, l1); S(up + '_img', a, l1 / 2, 0, l1, th, col)
    const f = B(lo, a, l1, 0, 0, l2); S(lo + '_img', f, l2 / 2, 0, l2, th, col)
    if (end) S(lo + '_end', f, l2, 0, end[0], end[1], end[2], end[3])
  }
  if (kind === 'person') { out = rig(); out[0].props.x = cx; out[0].props.y = cy }
  else if (kind === 'stick') {
    const c = '#e5e7eb', hips = B('Hips', null, cx, cy, -90, 200); S('Spine', hips, 100, 0, 200, 16, c)
    const head = B('Head', hips, 200, 0, 0, 100); S('Face', head, 55, 0, 110, 110, c, 'circle')
    S('EyeL', head, 70, -22, 14, 14, '#111827', 'circle'); S('EyeR', head, 70, 22, 14, 14, '#111827', 'circle'); S('Mouth', head, 38, 0, 8, 36, '#111827')
    limb('ArmL', 'ForearmL', hips, 180, 0, 205, 110, 100, 16, c); limb('ArmR', 'ForearmR', hips, 180, 0, 155, 110, 100, 16, c)
    limb('LegL', 'ShinL', hips, 0, 0, 190, 120, 120, 18, c); limb('LegR', 'ShinR', hips, 0, 0, 170, 120, 120, 18, c)
  } else if (kind === 'robot') {
    const hips = B('Hips', null, cx, cy, -90, 220); S('Torso', hips, 110, 0, 220, 200, '#94a3b8'); S('Core', hips, 110, 0, 60, 60, '#22d3ee', 'circle')
    const head = B('Head', hips, 220, 0, 0, 140); S('Face', head, 75, 0, 140, 160, '#cbd5e1')
    S('EyeL', head, 95, -40, 32, 32, '#22d3ee', 'circle'); S('EyeR', head, 95, 40, 32, 32, '#22d3ee', 'circle'); S('Mouth', head, 40, 0, 12, 80, '#0f172a')
    S('Antenna', head, 165, 0, 40, 10, '#64748b'); S('AntennaTip', head, 190, 0, 26, 26, '#ef4444', 'circle')
    const hand = [56, 56, '#f59e0b', 'rrect'], foot = [64, 64, '#334155', 'circle']
    limb('ArmL', 'ForearmL', hips, 200, -125, 200, 130, 120, 44, '#64748b', hand); limb('ArmR', 'ForearmR', hips, 200, 125, 160, 130, 120, 44, '#64748b', hand)
    limb('LegL', 'ShinL', hips, 0, -60, 185, 130, 130, 50, '#475569', foot); limb('LegR', 'ShinR', hips, 0, 60, 175, 130, 130, 50, '#475569', foot)
  } else if (kind === 'blob') {
    const g = G('Blob', cx, cy - 200)
    S('EarL', g, -130, -150, 70, 70, '#8b5cf6', 'circle'); S('EarR', g, 130, -150, 70, 70, '#8b5cf6', 'circle')
    S('Body', g, 0, 0, 380, 340, '#a78bfa', 'circle'); S('Belly', g, 0, 60, 240, 190, '#ddd6fe', 'circle')
    S('EyeL', g, -70, -50, 80, 80, '#fff', 'circle'); S('EyeR', g, 70, -50, 80, 80, '#fff', 'circle')
    S('PupilL', g, -64, -46, 34, 34, '#111827', 'circle'); S('PupilR', g, 76, -46, 34, 34, '#111827', 'circle'); S('Mouth', g, 0, 40, 120, 26, '#4c1d95')
  } else if (kind === 'bot') {
    const g = G('Bot', cx, cy - 200)
    S('LegL', g, -60, 230, 60, 120, '#475569'); S('LegR', g, 60, 230, 60, 120, '#475569'); S('ArmL', g, -150, 30, 50, 170, '#64748b'); S('ArmR', g, 150, 30, 50, 170, '#64748b')
    S('Body', g, 0, 50, 220, 260, '#94a3b8'); S('Core', g, 0, 60, 60, 60, '#22d3ee', 'circle'); S('Head', g, 0, -140, 200, 150, '#cbd5e1')
    S('EyeL', g, -45, -145, 36, 36, '#22d3ee', 'circle'); S('EyeR', g, 45, -145, 36, 36, '#22d3ee', 'circle'); S('Mouth', g, 0, -95, 90, 14, '#0f172a')
    S('Antenna', g, 0, -240, 8, 45, '#64748b'); S('AntennaTip', g, 0, -268, 26, 26, '#ef4444', 'circle')
  }
  let k = 1  // ชื่อซ้ำกับของเดิมในฉาก → ต่อท้าย _2, _3 ... ให้ทั้งตัว
  while (out.some(n => taken.has(n.name + (k > 1 ? '_' + k : '')))) k++
  if (k > 1) out.forEach(n => { n.name += '_' + k })
  return out
}

function runScript(code, layers0, dur0) {
  let layers = layers0.filter(l => !l.gen).map(l => ({ ...l, props: l.props.ch ? { ...l.props, ch: undefined } : l.props, keys: Object.fromEntries(Object.entries(l.keys).map(([p, a]) => [p, a.filter(k => !k.s)])) }))
  layers.forEach(l => { if (l.parent && !layers.some(x => x.id === l.parent)) l.parent = null })
  const subs = [], trans = [], sounds = [], sfxEv = []
  let cur = 0, end = 0
  const find = n => { const l = layers.find(x => x.name === n); if (!l) throw new Error(`ไม่พบเลเยอร์ชื่อ "${n}"`); return l }
  const put = (l, p, t, v, ease) => { l.keys[p] = putKey(l.keys[p], t, v, ease, true); end = Math.max(end, t) }
  const api = {
    animate: (name, o = {}) => {
      const l = find(name), d = o.duration ?? 1, st = cur + (o.delay || 0), ease = o.ease || 'ease'
      for (const p of ANIM) if (o[p] !== undefined) { if (d > 0) put(l, p, st, val(l, p, st), ease); put(l, p, st + d, o[p], 'linear') }
    },
    speak: (text, d, name, voice) => {
      d = d ?? Math.max(1, text.length * 0.09)
      subs.push({ start: cur, end: cur + d, text, who: name, voice })
      let c = (name && find(name)) || layers.find(x => x.type === 'character' && x.name === 'Character') || layers.find(x => x.type === 'character')
      if (!c) c = layers.find(x => x.name === 'Mouth')
      const pr = c && c.type !== 'character' ? 'scale' : 'mouth', f = v => (pr === 'mouth' ? v : 0.4 + v * 0.9)
      if (c) {
        const pat = [1, 0.2, 0.8, 0.1, 0.9, 0.3]
        put(c, pr, cur, f(0), 'linear')
        for (let t = cur + 0.1, i = 0; t < cur + d - 0.1; t += 0.14, i++) put(c, pr, t, f(pat[i % 6]), 'linear')
        put(c, pr, cur + d, f(0), 'linear')
      }
      cur += d; end = Math.max(end, cur)
    },
    wait: s => { cur += s },
    at: s => { cur = s },
    // หมุนกระดูกไปที่มุม (องศา, สัมพันธ์กับกระดูกแม่) ภายใน duration วินาที
    rotateBone: (name, angle, d = 0.5, ease) => api.animate(name, { rotation: angle, duration: d, ease }),
    // IK 2 ข้อต่อ: ให้ปลายกระดูก name ไปถึง (x,y) บนแคนวาส โดยหมุนกระดูก name และกระดูกแม่
    ikTarget: (name, x, y, d = 0.5, bend = 1) => {
      const B = find(name), A = layers.find(l => l.id === B.parent)
      if (!A || A.type !== 'bone') throw new Error(`"${name}" ต้องมีกระดูกแม่เพื่อทำ IK`)
      const w = computeWorld(layers, cur), mA = w.get(A.id).m, mB = w.get(B.id).m, S = mA.transformPoint(new DOMPoint(0, 0))
      const l1 = A.props.len * Math.hypot(mA.a, mA.b), l2 = B.props.len * Math.hypot(mB.a, mB.b)
      const dx = x - S.x, dy = y - S.y
      const dist = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3)
      const phi = Math.atan2(dy, dx), al = Math.acos((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist))
      const be = Math.acos((l1 * l1 + l2 * l2 - dist * dist) / (2 * l1 * l2))
      const a = phi + bend * al, b = a - bend * (Math.PI - be), deg = r => (r * 180) / Math.PI
      const pm = A.parent ? w.get(A.parent).m : camMatrix(layers, cur)
      const wrap = (v, ref) => v - 360 * Math.round((v - ref) / 360)
      const ra = deg(a) - deg(Math.atan2(pm.b, pm.a)), rb = deg(b - a)
      api.rotateBone(A.name, wrap(ra, val(A, 'rotation', cur)), d)
      api.rotateBone(B.name, wrap(rb, val(B, 'rotation', cur)), d)
    },
  }
  const poseTo = (deltas, d, sfx) => Object.entries(deltas).forEach(([b, dl]) => {
    const n = layers.find(x => x.type === 'bone' && x.name === b + sfx)
    if (n) api.animate(n.name, { rotation: n.props.rotation + dl, duration: d })
  })
  Object.assign(api, {
    camera: (o = {}) => api.animate('Camera', { x: o.x, y: o.y, scale: o.zoom, rotation: o.rotation, duration: o.duration, delay: o.delay, ease: o.ease }),
    shake: (amp = 20, d = 0.4) => {
      sfxEv.push({ name: 'boom', at: cur, vol: Math.min(1, 0.4 + amp / 60), auto: true, gen: true })
      const c = find('Camera'), bx = val(c, 'x', cur), by = val(c, 'y', cur)
      put(c, 'x', cur, bx, 'linear'); put(c, 'y', cur, by, 'linear')
      for (let i = 1; i * 0.04 < d; i++) { const k = 1 - (i * 0.04) / d; put(c, 'x', cur + i * 0.04, bx + Math.sin(i * 12.9) * amp * k, 'linear'); put(c, 'y', cur + i * 0.04, by + Math.cos(i * 7.7) * amp * k, 'linear') }
      put(c, 'x', cur + d, bx, 'linear'); put(c, 'y', cur + d, by, 'linear')
    },
    pose: (name, d = 0.5, sfx = '') => { if (!POSES[name]) throw new Error(`ไม่มีท่า "${name}" (มี: ${Object.keys(POSES).join(', ')})`); poseTo(POSES[name], d, sfx) },
    play: (name, secs = 2, sfx = '') => {
      const c = CLIPS[name]
      if (!c) throw new Error(`ไม่มีคลิป "${name}" (มี: ${Object.keys(CLIPS).join(', ')})`)
      const st = cur, step = c.p / c.k.length, t0 = st + (c.pre ? 0.3 : 0)
      if (c.pre) poseTo(c.pre, 0.3, sfx)
      for (let i = 0; t0 + i * c.p < st + secs - 0.01; i++) c.k.forEach(([ph, dl]) => { cur = t0 + i * c.p + ph * c.p; poseTo(dl, step, sfx) })
      const bs = new Set([...Object.keys(c.pre || {}), ...c.k.flatMap(([, dl]) => Object.keys(dl))])
      cur = st + secs; poseTo(Object.fromEntries([...bs].map(b => [b, 0])), 0.25, sfx); cur = st + secs
    },
    textAnim: (name, type = 'typewriter', d = 0.8) => {
      const l = find(name); l.props = { ...l.props, anim: type, animDur: d, animAt: cur }
      if (type === 'typewriter') sfxEv.push({ name: 'type', at: cur, vol: 0.5, rep: Math.max(1, Math.floor(d / 0.06)), gap: 0.06, auto: true, gen: true })
      else if (type === 'pop') sfxEv.push({ name: 'pop', at: cur, vol: 0.7, auto: true, gen: true })
      else if (type === 'slide') sfxEv.push({ name: 'swoosh', at: cur, vol: 0.5, auto: true, gen: true })
    },
    transition: (type = 'fade', d = 0.6) => {
      trans.push({ type, start: cur, dur: d }); end = Math.max(end, cur + d)
      sfxEv.push({ name: type === 'wipe' ? 'whoosh' : type === 'flash' ? 'zap' : 'swoosh', at: cur, vol: 0.6, auto: true, gen: true })
    },
    sound: (name, o = {}) => { sounds.push({ name, at: cur, ...o }) },
    // sfx('pop', { volume, delay, rep, gap }) → เอฟเฟกต์เสียงสังเคราะห์ (Web Audio) ที่เวลาปัจจุบัน
    sfx: (name, o = {}) => {
      if (!SFX_LIST.some(x => x[0] === name)) throw new Error(`ไม่มีเอฟเฟกต์เสียง "${name}" (มี: ${SFX_LIST.map(x => x[0]).join(', ')})`)
      sfxEv.push({ name, at: cur + (o.delay || 0), vol: o.volume ?? 1, rep: o.rep, gap: o.gap, gen: true })
    },
    // make(ชนิด, ชื่อ, props): สร้างเลเยอร์ใหม่ที่เวลาปัจจุบัน (สร้างใหม่ทุกครั้งที่ Run ไม่ซ้ำซ้อน)
    make: (type, name, o = {}) => {
      if (layers.some(x => x.name === name)) throw new Error(`มีเลเยอร์ชื่อ "${name}" อยู่แล้ว`)
      const base = { circle: ['shape', { w: 200, h: 200, color: '#f472b6', kind: 'circle' }], rect: ['shape', { w: 300, h: 200, color: '#38bdf8', kind: 'rrect' }], text: ['text', {}], group: ['group', {}], character: ['character', {}] }[type]
      if (!base) throw new Error(`make: ไม่รู้จักชนิด "${type}" (ใช้ได้: text, circle, rect, group, character)`)
      const { parent, ...rest } = o
      const l = { ...mk(base[0], name, { ...base[1], ...rest }), gen: true, parent: parent ? find(parent).id : null }
      layers.push(l)
      if (cur > 0) { put(l, 'opacity', 0, 0, 'hold'); put(l, 'opacity', cur, rest.opacity ?? 1, 'hold') }
    },
    // remove(ชื่อ): ซ่อนตั้งแต่เวลาปัจจุบัน (ลูกหายตามด้วย) · remove(ชื่อ, { delete: true }): ลบออกจากโปรเจกต์ถาวร
    remove: (name, o = {}) => {
      if (o.delete) {
        const ids = new Set(), l0 = layers.find(x => x.name === name), walk = id => { ids.add(id); layers.filter(x => x.parent === id).forEach(x => walk(x.id)) }
        if (l0) walk(l0.id)
        layers = layers.filter(x => !ids.has(x.id)); return
      }
      const l = find(name)
      put(l, 'opacity', cur, val(l, 'opacity', cur), 'hold'); put(l, 'opacity', cur + 0.001, 0, 'hold')
    },
    // edit(ชื่อ, props): x,y,scale,rotation,opacity เปลี่ยนที่เวลาปัจจุบัน (ใส่ duration ให้นุ่มนวลได้) · text,color,size,w,h,kind,anim,animDur,animAt เปลี่ยนตั้งแต่เวลาปัจจุบัน
    edit: (name, o = {}) => {
      const l = find(name), anim = {}, stat = {}, KEY = ['x', 'y', 'scale', 'rotation', 'opacity'], ST = ['text', 'color', 'size', 'w', 'h', 'kind', 'anim', 'animDur', 'animAt']
      Object.entries(o).forEach(([k, v]) => {
        if (['duration', 'delay', 'ease'].includes(k)) return
        if (KEY.includes(k)) anim[k] = v
        else if (ST.includes(k)) stat[k] = v
        else throw new Error(`edit: ไม่รู้จัก "${k}" (ใช้ได้: ${[...KEY, ...ST].join(', ')})`)
      })
      if (Object.keys(anim).length) api.animate(name, { ...anim, duration: Math.max(o.duration ?? 0, 0.001), delay: o.delay, ease: o.ease })
      if (Object.keys(stat).length) l.props = cur <= 0 ? { ...l.props, ...stat } : { ...l.props, ch: [...(l.props.ch || []), { t: cur, p: stat }].sort((a, b) => a.t - b.t) }
    },
  })
  new Function('animate', 'speak', 'wait', 'at', 'rotateBone', 'ikTarget', 'camera', 'shake', 'pose', 'play', 'textAnim', 'transition', 'sound', 'sfx', 'make', 'remove', 'edit', code)(
    api.animate, api.speak, api.wait, api.at, api.rotateBone, api.ikTarget, api.camera, api.shake, api.pose, api.play, api.textAnim, api.transition, api.sound, api.sfx, api.make, api.remove, api.edit)
  return { layers, subs, trans, sounds, sfx: sfxEv, duration: Math.max(dur0, Math.ceil((end + 0.5) * 10) / 10) }
}

const DEFAULT_SCRIPT = `// คำสั่งที่ใช้ได้
//   at(วินาที) / wait(วินาที)  → ย้าย/เลื่อนเวลาปัจจุบันของสคริปต์
//   animate('ชื่อเลเยอร์', { x, y, scale, rotation, opacity, duration, delay, ease: 'linear' | 'ease' })

                  <label className="flex items-center gap-2 text-zinc-400">ความเร็ว<input type="number" min="0.5" max="2" step="0.1" className={`${IN} !w-16`} value={ttsApi.hgSpeed ?? 1} onChange={e => setTtsApi(v => ({ ...v, hgSpeed: e.target.value }))} /></label></div>
                {hgVoices.length > 0 && <div className="flex items-center gap-1">
                  <select className={IN} value={ttsApi.voice} onChange={e => setTtsApi(v => ({ ...v, voice: e.target.value }))}><option value="">— เลือกเสียง —</option>{hgVoices.map(v => <option key={v.voice_id} value={v.voice_id}>{v.name} ({v.language || '?'}{v.gender ? ' · ' + v.gender : ''})</option>)}</select>
                  <button className={B} title="ฟังตัวอย่างเสียง" onClick={() => { const u = hgVoices.find(v => v.voice_id === ttsApi.voice)?.preview_audio_url; if (u) try { new Audio(u).play() } catch (e) {} }}>▶</button></div>}
                <input className={IN} placeholder="Voice ID (HeyGen)" value={ttsApi.voice} onChange={e => setTtsApi(v => ({ ...v, voice: e.target.value }))} />
              </>}
              {ttsApi.provider === 'vajax' ? <>
                <div className="flex items-center gap-2"><button className={B} onClick={() => vxIn.current.click()}>+ เสียงอ้างอิง</button><span className="text-zinc-500">ไฟล์เสียงอะไรก็ได้ — แปลงเป็น WAV ให้อัตโนมัติ (แนะนำ 5–12 วินาที)</span>
                  <input ref={vxIn} type="file" accept="audio/*" hidden onChange={addRef} /></div>
                {vxRefs.map(r => (
                  <div key={r.id} className="space-y-1 bg-zinc-900/60 rounded p-1.5">
                    <div className="flex items-center gap-1">
                      <input className={IN} title="ชื่อเสียง — ใช้ใน speak('...', 3, 'Mouth', 'ชื่อเสียง')" value={r.name} onChange={e => updRef(r.id, { name: e.target.value.trim() || r.name })} />
                      <span className="text-zinc-500 whitespace-nowrap">{r.dur.toFixed(1)}s</span>
                      <button className={B} title="ฟังเสียงอ้างอิง" onClick={() => { try { new Audio('data:audio/wav;base64,' + r.b64).play() } catch (e) {} }}>▶</button>
                      <button className={B} onClick={() => { setVxRefs(x => x.filter(y => y.id !== r.id)); if (ttsApi.voice === r.id) setTtsApi(v => ({ ...v, voice: '' })) }}>✕</button></div>
                    <textarea rows="2" className={IN} placeholder="ข้อความที่ตรงกับเสียงอ้างอิงนี้ (reference_text)" value={r.text} onChange={e => updRef(r.id, { text: e.target.value })} />
                    {r.dur > 15 && <div className="text-amber-400">เสียงอ้างอิงยาวเกิน 15 วินาที — แนะนำตัดให้สั้นลง ผลลัพธ์จะเสถียรกว่า</div>}
                  </div>
                ))}
                {vxRefs.length > 0 && <div className="flex items-center gap-2"><span className="text-zinc-400 whitespace-nowrap">เสียงเริ่มต้น</span>
                  <select className={IN} value={ttsApi.voice} onChange={e => setTtsApi(v => ({ ...v, voice: e.target.value }))}>{vxRefs.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select></div>}
                <div className="grid grid-cols-2 gap-x-3 gap-y-1 items-center">
                  <label className="flex items-center gap-2 text-zinc-400">ความเร็ว<input type="number" min="0.5" max="2" step="0.1" className={IN} value={ttsApi.vx?.speed ?? 1} onChange={e => setTtsApi(v => ({ ...v, vx: { ...v.vx, speed: e.target.value } }))} /></label>
                  <label className="flex items-center gap-2 text-zinc-400" title="คุณภาพเสียง 16–64 (สูง = ช้าแต่ชัด)">NFE<input type="number" min="16" max="64" step="4" className={IN} value={ttsApi.vx?.nfe ?? 32} onChange={e => setTtsApi(v => ({ ...v, vx: { ...v.vx, nfe: e.target.value } }))} /></label>
                  <label className="flex items-center gap-2 text-zinc-400" title="0–65535 · เว้นว่าง = สุ่ม · ใส่ค่าเดิมเพื่อให้ได้เสียงเหมือนเดิม">Seed<input type="number" min="0" max="65535" className={IN} placeholder="สุ่ม" value={ttsApi.vx?.seed ?? ''} onChange={e => setTtsApi(v => ({ ...v, vx: { ...v.vx, seed: e.target.value } }))} /></label>
                  <label className="flex items-center gap-2 text-zinc-400"><input type="checkbox" checked={!!ttsApi.vx?.phoneme} onChange={e => setTtsApi(v => ({ ...v, vx: { ...v.vx, phoneme: e.target.checked } }))} />ใช้ Phoneme</label></div>
                <button className={`${B} w-full`} disabled={!!ttsBusy} onClick={testVx}>▶ ทดลองเสียง “สวัสดีครับ ทดสอบเสียงพูด”</button>
              </> : ttsApi.provider === 'heygen' || ttsApi.provider === 'edge' ? null : <div className="flex gap-2">
                <input className={IN} placeholder="Model" value={ttsApi.model} onChange={e => setTtsApi(v => ({ ...v, model: e.target.value }))} />
                <input className={IN} placeholder={ttsApi.provider === 'eleven' ? 'Voice ID' : 'Voice'} value={ttsApi.voice} onChange={e => setTtsApi(v => ({ ...v, voice: e.target.value }))} /></div>}
              <label className="flex items-center gap-2"><input type="checkbox" checked={ttsApi.autoExport !== false} onChange={e => setTtsApi(v => ({ ...v, autoExport: e.target.checked }))} />สร้างเสียงจาก API อัตโนมัติตอน Export (ถ้าซับ/ค่าเสียงเปลี่ยน)</label>
              <button className={`${B} w-full`} disabled={!!ttsBusy} onClick={genTTS}>{ttsBusy ? `กำลังสร้างเสียง ${ttsBusy}…` : '🎙 สร้างเสียงจากซับไตเติล + Lip-sync'}</button>
              <div className="text-zinc-500">คีย์เก็บในเบราว์เซอร์นี้เท่านั้น ไม่ถูกบันทึกลงไฟล์โปรเจกต์ · เสียงที่สร้างจะถูกอัดลงวิดีโอตอน Export · เมื่อมีเสียงจาก API แล้ว พรีวิว Web Speech จะหยุดอ่านซ้ำ (ลบเสียง tts_ ในรายการเสียงถ้าอยากกลับไปพรีวิวด้วย Web Speech)</div>
              <div className="pt-1 font-semibold">แหล่งสื่อฟรี (ตรวจไลเซนส์ก่อนใช้)</div>
              {MEDIA.map(([n, u]) => <a key={u} href={u} target="_blank" rel="noreferrer" className="block text-sky-400 hover:underline">{n}</a>)}
              <div className="pt-1 text-zinc-500">คลิกวัตถุเพื่อแก้ไข · ปุ่มลัด: Space เล่น, K คีย์, Delete ลบ, ลูกศรขยับ (Shift = 10px), Ctrl+C/V คัดลอก/วางคีย์, Shift+ลากบนไทม์ไลน์ = เลือกหลายคีย์</div>
            </div>
          ) : <>
            <div className="flex items-center gap-2">
              <div className="flex-1 font-semibold truncate">{cur.name}</div>
              <button className={B} title="ทำสำเนา (Ctrl+D)" onClick={() => dup(cur.id)}>⧉ สำเนา</button>
              <button className={`${B} !text-red-400`} onClick={() => remove(cur.id)}>ลบ</button>
            </div>
            {fields.map(p => (
              <div key={p} className="flex items-center gap-2">
                <span className="w-20 text-xs text-zinc-400">{LBL[p]}</span>
                <input type="number" step={p === 'scale' || p === 'opacity' || p === 'mouth' ? 0.05 : 1} className={IN}
                  value={Math.round(val(cur, p, time) * 100) / 100} onChange={e => upd(cur.id, l => setProp(l, p, parseFloat(e.target.value) || 0, time, ease))} />
                <button title="เพิ่ม/ลบ Keyframe ที่เวลานี้" onClick={() => toggleKey(p)}
                  className={`w-6 h-6 shrink-0 ${hasKey(cur, p, time) ? 'text-amber-400' : cur.keys[p]?.length ? 'text-amber-800' : 'text-zinc-600'} hover:text-amber-300`}>◆</button>
              </div>
            ))}
            <div className="flex items-center gap-2"><span className="w-20 text-xs text-zinc-400">Pivot X / Y</span>
              <input type="number" className={IN} value={cur.props.px || 0} onChange={e => setP('px', +e.target.value || 0)} />
              <input type="number" className={IN} value={cur.props.py || 0} onChange={e => setP('py', +e.target.value || 0)} /></div>
            {cur.type === 'bone' && (
              <div className="flex items-center gap-2"><span className="w-20 text-xs text-zinc-400">Length</span>
                <input type="number" className={IN} value={Math.round(cur.props.len)} onChange={e => upd(cur.id, l => ({ ...l, props: { ...l.props, len: Math.max(10, +e.target.value || 10) } }))} /></div>
            )}
            {cur.type === 'shape' && <input type="color" value={cur.props.color} onChange={e => upd(cur.id, l => ({ ...l, props: { ...l.props, color: e.target.value } }))} className="w-9 h-7 bg-transparent" />}
            {cur.type === 'text' && <>
              <div className="text-xs text-zinc-400 pt-1">Text Content</div>
              <textarea className={IN} rows={2} value={cur.props.text} onChange={e => upd(cur.id, l => ({ ...l, props: { ...l.props, text: e.target.value } }))} />
              <div className="flex gap-2 items-center">
                <select className={IN} value={cur.props.anim || 'none'} onChange={e => setP('anim', e.target.value)}>{['none', 'typewriter', 'pop', 'slide', 'fade'].map(k => <option key={k} value={k}>{k}</option>)}</select>
                <input type="number" step="0.1" title="เริ่มที่ (วินาที)" className={`${IN} !w-16`} value={cur.props.animAt || 0} onChange={e => setP('animAt', +e.target.value || 0)} />
                <input type="number" step="0.1" title="ความยาว (วินาที)" className={`${IN} !w-16`} value={cur.props.animDur || 0.8} onChange={e => setP('animDur', +e.target.value || 0.8)} />
              </div>
              <div className="flex gap-2 items-center">
                <input type="color" value={cur.props.color} onChange={e => upd(cur.id, l => ({ ...l, props: { ...l.props, color: e.target.value } }))} className="w-9 h-7 bg-transparent" />
                <input type="number" className={IN} value={cur.props.size} onChange={e => upd(cur.id, l => ({ ...l, props: { ...l.props, size: +e.target.value || 10 } }))} />
              </div>
            </>}
            <div className="flex flex-wrap gap-2 pt-2">
              <select className={IN} value={ease} onChange={e => { setEase(e.target.value); if (selKeys.length) applyEase(e.target.value) }}>{Object.keys(EASE).map(k => <option key={k} value={k}>{k}</option>)}</select>
              <EaseGraph k={ease} />
              <button className={`${B} whitespace-nowrap`} onClick={keyAll}>◆ Keyframe ทั้งหมด</button>
            </div>
          </>}
        </div>
      </div>

      {/* Bottom dock */}
      <div className="h-64 shrink-0 flex border-t border-zinc-800">
        <div className="w-1/2 overflow-auto bg-zinc-900 border-r border-zinc-800 relative">
          <div ref={content} className="relative" style={{ width: LABEL + duration * PPS + 60, minHeight: '100%' }}>
            <div className="sticky top-0 z-20 h-6 bg-zinc-950 border-b border-zinc-800 cursor-col-resize" onPointerDown={scrub}>
              {Array.from({ length: Math.floor(duration) + 1 }, (_, i) => (
                <div key={i} className="absolute top-0 h-full border-l border-zinc-700 pl-1 text-[10px] text-zinc-500" style={{ left: LABEL + i * PPS }}>{i}s</div>
              ))}
            </div>
            <div onPointerDown={scrub}>
              {flat.map(({ l, d }) => {
                const times = [...new Set(ANIM.flatMap(p => (l.keys[p] || []).map(k => +k.t.toFixed(3))))]
                return (
                  <div key={l.id} onClick={() => setSel(l.id)} className={`flex h-7 border-b border-zinc-800 ${sel === l.id ? 'bg-sky-900/30' : ''}`}>
                    <div className="sticky left-0 z-10 shrink-0 bg-zinc-900 border-r border-zinc-800 flex items-center truncate text-xs" style={{ width: LABEL, paddingLeft: 8 + d * 10 }}>{l.name}</div>
                    <div className="relative flex-1">
                      {times.map(t => (
                        <div key={t} title="ลาก=ย้าย · ดับเบิลคลิก=ลบ" onPointerDown={e => startKeyDrag(e, l.id, t)} onDoubleClick={() => delKeys(l.id, t)}
                          className={`absolute top-1/2 w-3 h-3 -mt-1.5 -ml-1.5 rotate-45 border cursor-ew-resize ${selKeys.includes(kid(l.id, t)) ? 'bg-white border-sky-400' : 'bg-amber-400 border-amber-700'}`} style={{ left: t * PPS }} />
                      ))}
                    </div>
                  </div>
                )
              })}
              <div className="flex h-7 border-b border-zinc-800">
                <div className="sticky left-0 z-10 shrink-0 bg-zinc-900 border-r border-zinc-800 flex items-center px-2 text-xs text-zinc-400" style={{ width: LABEL }}>ซับไตเติล</div>
                <div className="relative flex-1">
                  {subs.map((s, i) => (
                    <div key={i} className="absolute top-1 h-5 rounded bg-violet-700/70 text-[10px] px-1 truncate" style={{ left: s.start * PPS, width: (s.end - s.start) * PPS }}>{s.text}</div>
                  ))}
                </div>
              </div>
            </div>
            {box && <div className="absolute border border-sky-400 bg-sky-400/10 z-40 pointer-events-none" style={{ left: Math.min(box.x0, box.x1), top: Math.min(box.y0, box.y1), width: Math.abs(box.x1 - box.x0), height: Math.abs(box.y1 - box.y0) }} />}
            <div className="absolute top-0 bottom-0 w-px bg-red-500 z-30 pointer-events-none" style={{ left: LABEL + time * PPS }}>
              <div className="absolute -top-0 -left-1.5 w-3 h-4 bg-red-500 rounded-b" />
            </div>
          </div>
        </div>

        <div className="w-1/2 flex flex-col bg-zinc-900">
          <div className="h-8 shrink-0 flex items-center gap-2 px-2 border-b border-zinc-800">
            <span className="text-xs text-zinc-400 flex-1">Script (JavaScript)</span>
            <button className={`${B} !bg-sky-600 hover:!bg-sky-500`} onClick={run}>▶ Run Script</button>
          </div>
          <textarea spellCheck={false} value={code} onChange={e => setCode(e.target.value)}
            className="flex-1 min-h-0 resize-none bg-zinc-950 p-2 font-mono text-xs text-emerald-200 outline-none select-text" />
          {err && <div className="px-2 py-1 text-xs text-red-300 bg-red-950">⚠ {err}</div>}
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>
</body>
</html>
